# Number of pod replicas
replicaCount: 1

# -------------------------------------------------------------------
# Frontend Proxy (Envoy) Configuration
# -------------------------------------------------------------------

image:
  repository: 848684726346.dkr.ecr.ap-south-1.amazonaws.com/project/cicdproject
  tag: frontend-proxy-latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

# --- Resource Allocations ---
# Increased memory limits to prevent CrashLoopBackOff/OOM failures
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# --- Environment Variables ---
# Envoy uses these to dynamically assemble its proxy configuration on startup
env:
  # Envoy Listening Port
  - name: ENVOY_PORT
    value: "8080"

  # Primary Frontend Microservice (Next.js)
  - name: FRONTEND_HOST
    value: "ecommerce-frontend" # Update to match your actual frontend service name
  - name: FRONTEND_PORT
    value: "8080"

  # OpenTelemetry Collector
  - name: OTEL_COLLECTOR_NAME
    value: "otel-collector"
  - name: OTEL_COLLECTOR_HOST
    value: "otel-collector"
  - name: OTEL_COLLECTOR_PORT_GRPC
    value: "4317"
  - name: OTEL_COLLECTOR_PORT_HTTP
    value: "4318"

  # Feature Flags (Flagd)
  - name: FLAGD_HOST
    value: "flagd"
  - name: FLAGD_PORT
    value: "8013"
  - name: FLAGD_UI_HOST
    value: "flagd-ui"
  - name: FLAGD_UI_PORT
    value: "4000"

  # Image Provider
  - name: IMAGE_PROVIDER_HOST
    value: "imageprovider"
  - name: IMAGE_PROVIDER_PORT
    value: "8081"

  # Observability Tools (Grafana & Jaeger)
  - name: GRAFANA_SERVICE_HOST
    value: "grafana"
  - name: GRAFANA_SERVICE_PORT
    value: "3000"
  - name: JAEGER_SERVICE_HOST
    value: "jaeger"
  - name: JAEGER_SERVICE_PORT
    value: "16686"

  # Load Generator / Locust
  - name: LOCUST_WEB_HOST
    value: "locust"
  - name: LOCUST_WEB_PORT
    value: "8089"